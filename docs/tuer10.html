<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mitarbeiterbereich</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Mitarbeiterbereich</h1><p id="t"></p><p><a href="./">Zurück zum Kalender</a></p></main>
<script>
const rolle = new URLSearchParams(location.search).get("rolle");
document.getElementById("t").textContent = rolle === "admin"
  ? "ACCESS GRANTED 😎 Willkommen, Admin! Deine Flagge: CTRL{URL_IST_MANIPULIERBAR}"
  : "Hey " + (rolle || "Unbekannt") + "! 👋 Als " + (rolle || "Unbekannter") + " siehst du hier gar nichts. Nur Admins dürfen rein.";
</script></body></html>
